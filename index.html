<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrateNote V8.4 - Real-time Detect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#F6F7FB;--card:#fff;--text:#111;--muted:#eee;--box:#f9f9f9;--primary:#111}
  .dark{--bg:#121212;--card:#1e1e1e;--text:#fff;--muted:#2a2a2a;--box:#252525;--primary:#fff}
  *{box-sizing:border-box;font-family:-apple-system,sans-serif} body{margin:0;background:var(--bg);color:var(--text);padding:12px}
  .header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 18px;border-radius:14px;margin-bottom:12px}
  .main{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:12px} @media(min-width:900px){.main{flex-direction:row}}
  .card{background:var(--card);border-radius:14px;padding:14px;flex:1}
  #transcriptBox{min-height:220px;background:var(--box);border-radius:10px;padding:12px;line-height:26px;font-size:17px;white-space:pre-wrap;border:2px solid transparent;outline:none;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#888}
  #transcriptBox.has-text{display:block;color:var(--text);align-items:flex-start;justify-content:flex-start}
  #transcriptBox.listening{border-color:#6366f1}
  .emptyIcon{font-size:48px;margin-bottom:12px;opacity:.3} .emptyTxt{font-size:15px}
  .badge{font-size:12px;padding:5px 10px;border-radius:20px;display:none;margin-right:6px;font-weight:600;transition:.2s} .badge.on{display:inline-block} #liveBadge{background:#10b981;color:#fff;animation:pulse 1.2s infinite} #detectedBadge{background:#e0e7ff;color:#3730a3} @keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
  input,select,textarea{width:100%;padding:12px;border-radius:8px;border:none;background:var(--muted);color:var(--text);margin-bottom:10px;font-size:15px}
  button{padding:12px 14px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;justify-content:center;align-items:center}
  .full{width:100%;margin-top:8px} #recBtn{background:var(--primary);color:var(--bg);font-size:16px;padding:16px} #recBtn.rec{background:#e11d48;color:#fff}
  .iconBtn{width:auto;padding:6px 10px;border-radius:6px;background:var(--muted);color:var(--text);font-size:12px}
  .note{background:var(--box);padding:10px;border-radius:10px;margin-bottom:10px}
  .noteActions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap} .actBtn{padding:6px 10px;border-radius:6px;background:var(--muted);color:var(--text);font-size:12px;cursor:pointer;border:none;display:inline-flex;gap:4px;align-items:center}
  #settingsModal,#editModal,#translateModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:999;padding:12px}
  .modalBox{background:var(--card);width:100%;max-width:560px;border-radius:16px;padding:18px;max-height:90vh;overflow:auto}
  .row{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
  .switch{width:46px;height:28px;background:#ccc;border-radius:20px;position:relative;cursor:pointer} .switch.on{background:var(--primary)} .dot{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s} .switch.on .dot{left:20px}
  label{font-size:13px;font-weight:600;margin:8px 0 4px;display:block;opacity:.8}
</style>
</head>
<body>
<div class="header"><div><b><i class="fa-solid fa-microphone-lines"></i> KrateNote</b> <small id="statusTxt" style="color:#6366f1;margin-left:8px"></small></div><button class="iconBtn" id="openSetBtn"><i class="fa-solid fa-gear"></i> Settings</button></div>

<div class="main">
  <div class="card">
    <input id="titleInput" placeholder="Lecture Title">
    <div style="margin-bottom:8px"><span id="liveBadge" class="badge"><i class="fa-solid fa-circle" style="font-size:8px"></i> LIVE</span><span id="detectedBadge" class="badge">🌐 Detecting...</span></div>
    <div id="transcriptBox" contenteditable="true"></div>
    <button class="full" id="recBtn"><i class="fa-solid fa-microphone"></i> START RECORDING</button>
    <div style="display:flex;gap:6px">
      <button class="full" id="saveBtn" style="background:#e0e7ff;color:#1e1b4b"><i class="fa-solid fa-floppy-disk"></i> SAVE</button>
      <button class="full" id="speakBtn" style="background:var(--muted)"><i class="fa-solid fa-volume-high"></i> SPEAK</button>
      <button class="full" id="translateBtn" style="background:var(--muted)"><i class="fa-solid fa-language"></i> TRANSLATE</button>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between"><b>Notes (<span id="count">0</span>)</b>
      <div style="display:flex;gap:4px"><button class="iconBtn" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> PDF</button><button class="iconBtn" id="exportTxtBtn"><i class="fa-solid fa-file-lines"></i> TXT</button></div>
    </div>
    <div id="notesList" style="margin-top:10px"></div>
  </div>
</div>

<div id="settingsModal"><div class="modalBox">
  <div style="display:flex;justify-content:space-between"><h3><i class="fa-solid fa-gear"></i> Settings</h3><button class="iconBtn" id="closeSetBtn"><i class="fa-solid fa-xmark"></i></button></div>
  <input id="serverUrl" type="hidden" value="https://kratenote-1.onrender.com">
  <label><i class="fa-solid fa-volume-high"></i> Voice</label><select id="voiceSelect"><option>Loading...</option></select>
  <label><i class="fa-solid fa-microphone"></i> Speech Language</label><select id="speechLang"></select>
  <label><i class="fa-solid fa-language"></i> Translate To</label><select id="translateTo"></select>
  <label><i class="fa-solid fa-gauge-high"></i> Speed: <span id="speedVal">0.9</span></label><input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="0.9">
  <label><i class="fa-solid fa-waveform"></i> Pitch: <span id="pitchVal">1.0</span></label><input type="range" id="pitchRange" min="0.5" max="1.5" step="0.1" value="1.0">
  <label><i class="fa-solid fa-text-height"></i> Font Size</label><select id="fontSelect"><option value="15px">Small</option><option value="17px" selected>Medium</option><option value="20px">Large</option><option value="24px">XL</option></select>
  <div class="row"><span><i class="fa-solid fa-moon"></i> Dark Mode</span><div id="darkSwitch" class="switch"><div class="dot"></div></div></div>
  <div class="row"><span><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Detect</span><div class="switch on" id="autoSwitch"><div class="dot"></div></div></div>
  <button class="full" style="background:#fee2e2;color:#b91c1c;margin-top:10px" id="clearBtn"><i class="fa-solid fa-trash"></i> Clear All</button>
</div></div>

<div id="editModal"><div class="modalBox">
  <div style="display:flex;justify-content:space-between"><h3><i class="fa-solid fa-pen-to-square"></i> Edit Note</h3><button class="iconBtn" id="closeEditBtn"><i class="fa-solid fa-xmark"></i></button></div>
  <label>Title</label><input id="editTitle">
  <label>Language</label><select id="editLang"></select>
  <label>Text</label><textarea id="editText" rows="8"></textarea>
  <label>Translate To</label><div style="display:flex;gap:6px"><select id="editTranslateTo"></select><button class="iconBtn" id="doEditTranslate"><i class="fa-solid fa-language"></i> Translate</button></div>
  <div style="display:flex;gap:6px;margin-top:10px"><button class="full" id="saveEditBtn" style="background:var(--primary);color:var(--bg)"><i class="fa-solid fa-check"></i> Save</button><button class="full" id="cancelEditBtn" style="background:var(--muted)"><i class="fa-solid fa-xmark"></i> Cancel</button></div>
</div></div>

<div id="translateModal"><div class="modalBox">
  <div style="display:flex;justify-content:space-between"><h3><i class="fa-solid fa-language"></i> Translate</h3><button class="iconBtn" id="closeTranslateBtn"><i class="fa-solid fa-xmark"></i></button></div>
  <label>From</label><select id="fromLang"></select>
  <label>To</label><select id="toLang"></select>
  <label>Original</label><textarea id="origText" rows="4"></textarea>
  <label>Translated</label><textarea id="transText" rows="4" placeholder="Translation..."></textarea>
  <div style="display:flex;gap:6px"><button class="full" id="doTranslateBtn" style="background:var(--primary);color:var(--bg)"><i class="fa-solid fa-language"></i> Translate Now</button><button class="full" id="speakTransBtn" style="background:var(--muted)"><i class="fa-solid fa-volume-high"></i> Speak</button></div>
  <button class="full" id="saveTransBtn" style="background:#e0e7ff;color:#1e1b4b;margin-top:6px"><i class="fa-solid fa-floppy-disk"></i> Save</button>
</div></div>

<script>
const LANGS=[
  {code:'auto',name:'Auto Detect',flag:'🌐',tts:'en-US'},
  {code:'en',name:'English',flag:'🇬🇧',tts:'en-US'},
  {code:'ibb',name:'Ibibio',flag:'🇳🇬',tts:'en-NG'},
  {code:'efi',name:'Efik',flag:'🇳🇬',tts:'en-NG'},
  {code:'ha',name:'Hausa',flag:'🇳🇬',tts:'ha-NG'},
  {code:'yo',name:'Yoruba',flag:'🇳🇬',tts:'yo-NG'},
  {code:'ig',name:'Igbo',flag:'🇳🇬',tts:'ig-NG'},
  {code:'pcm',name:'Pidgin',flag:'🇳🇬',tts:'en-NG'},
  {code:'fr',name:'French',flag:'🇫🇷',tts:'fr-FR'},
  {code:'es',name:'Spanish',flag:'🇪🇸',tts:'es-ES'},
  {code:'de',name:'German',flag:'🇩🇪',tts:'de-DE'},
  {code:'pt',name:'Portuguese',flag:'🇵🇹',tts:'pt-PT'},
  {code:'it',name:'Italian',flag:'🇮🇹',tts:'it-IT'},
  {code:'nl',name:'Dutch',flag:'🇳🇱',tts:'nl-NL'},
  {code:'ar',name:'Arabic',flag:'🇸🇦',tts:'ar-SA'},
  {code:'zh',name:'Chinese',flag:'🇨🇳',tts:'zh-CN'},
  {code:'ja',name:'Japanese',flag:'🇯🇵',tts:'ja-JP'},
  {code:'ko',name:'Korean',flag:'🇰🇷',tts:'ko-KR'},
  {code:'ru',name:'Russian',flag:'🇷🇺',tts:'ru-RU'},
  {code:'hi',name:'Hindi',flag:'🇮🇳',tts:'hi-IN'},
  {code:'sw',name:'Swahili',flag:'🇰🇪',tts:'sw-KE'},
  {code:'zu',name:'Zulu',flag:'🇿🇦',tts:'zu-ZA'},
  {code:'am',name:'Amharic',flag:'🇪🇹',tts:'am-ET'},
  {code:'tr',name:'Turkish',flag:'🇹🇷',tts:'tr-TR'},
  {code:'el',name:'Greek',flag:'🇬🇷',tts:'el-GR'},
  {code:'he',name:'Hebrew',flag:'🇮🇱',tts:'he-IL'},
  {code:'sv',name:'Swedish',flag:'🇸🇪',tts:'sv-SE'},
  {code:'no',name:'Norwegian',flag:'🇳🇴',tts:'nb-NO'},
  {code:'pl',name:'Polish',flag:'🇵🇱',tts:'pl-PL'},
  {code:'id',name:'Indonesian',flag:'🇮🇩',tts:'id-ID'},
  {code:'th',name:'Thai',flag:'🇹🇭',tts:'th-TH'}
];

function fillLangSelects(){
  const opts = LANGS.map(l=>`<option value="${l.code}">${l.flag} ${l.name}</option>`).join('');
  const optsNoAuto = LANGS.filter(l=>l.code!=='auto').map(l=>`<option value="${l.code}">${l.flag} ${l.name}</option>`).join('');
  document.getElementById('speechLang').innerHTML=opts;
  document.getElementById('translateTo').innerHTML=optsNoAuto;
  document.getElementById('fromLang').innerHTML=opts;
  document.getElementById('toLang').innerHTML=optsNoAuto;
  document.getElementById('editLang').innerHTML=optsNoAuto;
  document.getElementById('editTranslateTo').innerHTML=optsNoAuto;
}

// IMPROVED REAL-TIME DETECTION
function detectLanguage(text){
  const t=text.toLowerCase().trim();
  if(!t) return LANGS[0];
  if(/(mmesiere|mma mmi|nsido|idem mmi|ufok nwed|sosongo|ndi|yak inam|mfin emi|eti ete|amakabade)/.test(t)) return LANGS.find(l=>l.code==='ibb');
  if(/(emem o|mesiere|mokomor|efi ibibio|sosongho)/.test(t)) return LANGS.find(l=>l.code==='efi');
  if(/(sannu|ina kwana|yaya dai|hausa|lafiya)/.test(t)) return LANGS.find(l=>l.code==='ha');
  if(/(bawo ni|kaaro|pele o|yoruba|o dabo)/.test(t)) return LANGS.find(l=>l.code==='yo');
  if(/(kedu|ndewo|igbo kwenu|daalu|biko nu)/.test(t)) return LANGS.find(l=>l.code==='ig');
  if(/(how una dey|wetin|na so|abi|shebi|pidgin)/.test(t)) return LANGS.find(l=>l.code==='pcm');
  if(/(bonjour|merci beaucoup|comment ca va)/.test(t)) return LANGS.find(l=>l.code==='fr');
  if(/(hola|gracias|como estas)/.test(t)) return LANGS.find(l=>l.code==='es');
  if(/(hallo|danke|wie geht)/.test(t)) return LANGS.find(l=>l.code==='de');
  return LANGS.find(l=>l.code==='en');
}
let isRec=false, mediaRecorder=null, audioChunks=[], transcript='', notes=[], audioStream=null, editingIndex=-1, detectedLang=LANGS[1];
let settings={dark:false,font:'17px',voiceURI:'',serverUrl:'https://kratenote-1.onrender.com',speed:0.9,pitch:1,speechLang:'auto',translateTo:'en',autoDetect:true};
try{ notes=JSON.parse(localStorage.getItem('k_notes')||'[]'); const s=JSON.parse(localStorage.getItem('k_settings')||'{}'); settings={...settings,...s}; }catch(e){}
const recBtn=document.getElementById('recBtn'), box=document.getElementById('transcriptBox'), modal=document.getElementById('settingsModal'), editModal=document.getElementById('editModal'), transModal=document.getElementById('translateModal'), liveBadge=document.getElementById('liveBadge'), detectedBadge=document.getElementById('detectedBadge'), statusTxt=document.getElementById('statusTxt');
let voices=[], recognition=null, finalTranscriptLive='';

function setEmptyState(){
  box.classList.remove('has-text');
  box.innerHTML='<i class="fa-solid fa-waveform-lines emptyIcon"></i><div class="emptyTxt">Tap mic to start recording</div>';
  transcript=''; finalTranscriptLive='';
  detectedBadge.classList.remove('on');
  liveBadge.classList.remove('on');
  statusTxt.textContent='';
  recBtn.innerHTML='<i class="fa-solid fa-microphone"></i> START RECORDING';
  recBtn.classList.remove('rec');
  isRec=false;
}
function setHasTextState(text){
  box.classList.add('has-text');
  box.textContent=text;
}
function loadVoices(){
  voices=speechSynthesis.getVoices();
  const sel=document.getElementById('voiceSelect');
  if(voices.length){
    voices.sort((a,b)=>{ const sc=v=>{ let s=0; if(/Google|Natural|Premium|Neural/i.test(v.name)) s+=10; if(v.lang==='en-NG') s+=8; if(v.localService===false) s+=5; return s; }; return sc(b)-sc(a); });
    sel.innerHTML=voices.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang}) ${/Google|Natural/i.test(v.name)?'⭐ Clear':''}</option>`).join('');
    if(settings.voiceURI) sel.value=settings.voiceURI;
  }
}
speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,800);
function saveAll(){localStorage.setItem('k_notes',JSON.stringify(notes)); localStorage.setItem('k_settings',JSON.stringify(settings));}
function applySettings(){
  document.body.classList.toggle('dark',settings.dark);
  document.getElementById('darkSwitch').classList.toggle('on',settings.dark);
  document.getElementById('autoSwitch').classList.toggle('on',settings.autoDetect);
  document.getElementById('fontSelect').value=settings.font;
  document.getElementById('speechLang').value=settings.speechLang;
  document.getElementById('translateTo').value=settings.translateTo;
  document.getElementById('speedRange').value=settings.speed;
  document.getElementById('pitchRange').value=settings.pitch;
  document.getElementById('speedVal').textContent=settings.speed;
  document.getElementById('pitchVal').textContent=settings.pitch;
  box.style.fontSize=settings.font;
}
function speakClear(text, forcedLang=null){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  let langCode = forcedLang || settings.speechLang;
  if(langCode==='auto') langCode = detectLanguage(text).code;
  const langObj = LANGS.find(l=>l.code===langCode) || LANGS[1];
  let voice=null;
  if(['ibb','efi','pcm','ha','yo','ig'].includes(langCode)){
    voice = voices.find(v=>v.lang==='en-NG') || voices.find(v=>v.voiceURI===settings.voiceURI) || voices[0];
    u.lang='en-NG';
  } else {
    voice = voices.find(v=>v.lang.toLowerCase().startsWith((langObj.tts||'en').split('-')[0])) || voices.find(v=>v.voiceURI===settings.voiceURI) || voices[0];
    u.lang=langObj.tts||'en-US';
  }
  if(voice) u.voice=voice;
  u.rate=parseFloat(settings.speed); u.pitch=parseFloat(settings.pitch);
  speechSynthesis.speak(u);
}
function showDetected(text){
  if(!settings.autoDetect || !text) return;
  detectedLang=detectLanguage(text);
  if(detectedLang.code==='auto') detectedLang=LANGS.find(l=>l.code==='en');
  detectedBadge.innerHTML=`${detectedLang.flag} ${detectedLang.name}`;
  detectedBadge.classList.add('on');
}
// REAL-TIME SYNC ENGINE
function initRealtime(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  const rec=new SR(); rec.continuous=true; rec.interimResults=true; 
  let baseLang = settings.speechLang==='auto' ? 'en-NG' : (LANGS.find(l=>l.code===settings.speechLang)?.tts||'en-NG');
  rec.lang=baseLang;
  rec.onstart=()=>{
    liveBadge.classList.add('on');
    detectedBadge.innerHTML='🎙️ Listening...';
    detectedBadge.classList.add('on');
    finalTranscriptLive=''; statusTxt.textContent='Listening...';
  };
  rec.onresult=(e)=>{
    let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalTranscriptLive+=t+' '; else inter+=t; }
    const full = (finalTranscriptLive+inter).trim();
    if(full){
      if(!box.classList.contains('has-text')) box.classList.add('has-text');
      box.textContent=full;
      transcript=full;
      // UPDATE LANGUAGE BADGE IN REAL TIME ON EVERY WORD
      showDetected(full);
    }
  };
  rec.onend=()=>{ liveBadge.classList.remove('on'); if(transcript) statusTxt.textContent='Tap STOP to finish'; };
  rec.onerror=(e)=>{ console.log('SR error',e); };
  return rec;
}
async function initWhisper(){
  try{
    if(!audioStream) audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
    let mime='audio/mp4'; if(MediaRecorder.isTypeSupported('audio/mp4')) mime='audio/mp4'; else if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime='audio/webm;codecs=opus';
    mediaRecorder=new MediaRecorder(audioStream,{mimeType:mime}); audioChunks=[];
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=async()=>{
      const blob=new Blob(audioChunks,{type:mime});
      statusTxt.textContent='Transcribing...';
      const form=new FormData(); form.append('file',blob,mime.includes('mp4')?'recording.m4a':'recording.webm');
      try{ const res=await fetch(settings.serverUrl+'/transcribe',{method:'POST',body:form}); const data=await res.json(); if(data.text){ transcript=data.text; setHasTextState(data.text); showDetected(data.text); statusTxt.textContent='Done'; } }catch(e){ statusTxt.textContent='Saved from mic'; }
      setTimeout(()=>statusTxt.textContent='',2000);
    }; return mediaRecorder;
  }catch(e){ setHasTextState('Mic error: '+e.message); return null; }
}
recBtn.addEventListener('click',async()=>{
  if(!isRec){
    const rec=await initWhisper(); if(!rec) return;
    audioChunks=[]; transcript=''; finalTranscriptLive='';
    box.innerHTML=''; box.classList.add('has-text'); box.textContent='Listening...';
    recognition=initRealtime(); try{ if(recognition) recognition.start(); }catch(e){}
    rec.start(100); isRec=true; recBtn.innerHTML='<i class="fa-solid fa-stop"></i> STOP'; recBtn.classList.add('rec');
  }else{
    try{ if(recognition) recognition.stop(); }catch(e){}
    try{ mediaRecorder.stop(); }catch(e){}
    isRec=false; recBtn.innerHTML='<i class="fa-solid fa-microphone"></i> START RECORDING'; recBtn.classList.remove('rec');
  }
});
async function translateText(text,to){
  if(!text) return '';
  try{
    statusTxt.textContent='Translating...';
    const res = await fetch(settings.serverUrl.replace(/\/$/,'')+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.substring(0,3000), to:to})});
    const data = await res.json(); statusTxt.textContent='';
    if(data.translated) return data.translated;
    return text;
  }catch(e){ statusTxt.textContent=''; return text; }
}
function saveNote(){
  const txt=(box.innerText||'').trim()||transcript.trim(); if(!txt || txt.includes('Tap mic') || txt==='Listening...') return alert('Record first');
  const title=document.getElementById('titleInput').value||txt.split(' ').slice(0,5).join(' ');
  const lang=detectLanguage(txt);
  notes.unshift({title,text:txt,date:new Date().toLocaleString(),lang:lang.name,code:lang.code,flag:lang.flag});
  saveAll(); render();
  document.getElementById('titleInput').value='';
  setEmptyState();
  try{ if(recognition) recognition.stop(); }catch(e){}
  try{ if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop(); }catch(e){}
}
document.getElementById('saveBtn').addEventListener('click',saveNote);
document.getElementById('speakBtn').addEventListener('click',()=>{ const t=box.innerText.trim(); if(t && !t.includes('Tap mic') && t!=='Listening...') speakClear(t); });
document.getElementById('translateBtn').addEventListener('click',()=>{
  const t=box.innerText.trim(); if(!t || t.includes('Tap mic')) return alert('No text');
  document.getElementById('origText').value=t; document.getElementById('fromLang').value='auto'; document.getElementById('toLang').value=settings.translateTo; transModal.style.display='flex';
});
document.getElementById('doTranslateBtn').addEventListener('click',async()=>{
  const orig=document.getElementById('origText').value; const to=document.getElementById('toLang').value;
  document.getElementById('transText').value='Translating...'; 
  const tr=await translateText(orig,to); 
  document.getElementById('transText').value=tr;
});
document.getElementById('speakTransBtn').addEventListener('click',()=>{ const txt=document.getElementById('transText').value; const to=document.getElementById('toLang').value; if(txt) speakClear(txt,to); });
document.getElementById('saveTransBtn').addEventListener('click',()=>{
  const txt=document.getElementById('transText').value; if(!txt) return;
  const lang=LANGS.find(l=>l.code===document.getElementById('toLang').value);
  notes.unshift({title:'Translated to '+lang.name,text:txt,date:new Date().toLocaleString(),lang:lang.name,code:lang.code,flag:lang.flag});
  saveAll(); render(); transModal.style.display='none';
});
function render(){
  document.getElementById('count').textContent=notes.length;
  document.getElementById('notesList').innerHTML=notes.map((n,i)=>`
    <div class="note">
      <div style="display:flex;justify-content:space-between"><b>${n.flag||''} ${n.title}</b><small>${n.date}</small></div>
      <small>${n.lang||''}</small>
      <div style="margin-top:4px;white-space:pre-wrap">${n.text}</div>
      <div class="noteActions">
        <button class="actBtn" data-edit="${i}"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
        <button class="actBtn" data-speak="${i}"><i class="fa-solid fa-volume-high"></i> Speak</button>
        <button class="actBtn" data-trans="${i}"><i class="fa-solid fa-language"></i> Translate</button>
        <button class="actBtn" data-del="${i}" style="background:#fee2e2;color:#b91c1c"><i class="fa-solid fa-trash"></i> Delete</button>
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{ if(confirm('Delete?')){ notes.splice(parseInt(el.dataset.del),1); saveAll(); render(); }}));
  document.querySelectorAll('[data-speak]').forEach(el=>el.addEventListener('click',()=>{ const nn=notes[parseInt(el.dataset.speak)]; speakClear(nn.text,nn.code); }));
  document.querySelectorAll('[data-trans]').forEach(el=>el.addEventListener('click',()=>{ const nn=notes[parseInt(el.dataset.trans)]; document.getElementById('origText').value=nn.text; document.getElementById('toLang').value=settings.translateTo; transModal.style.display='flex'; }));
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>{ const idx=parseInt(el.dataset.edit); editingIndex=idx; document.getElementById('editTitle').value=notes[idx].title; document.getElementById('editText').value=notes[idx].text; document.getElementById('editLang').value=notes[idx].code||'en'; editModal.style.display='flex'; }));
}
document.getElementById('openSetBtn').addEventListener('click',()=>modal.style.display='flex');
document.getElementById('closeSetBtn').addEventListener('click',()=>modal.style.display='none');
document.getElementById('closeEditBtn').addEventListener('click',()=>editModal.style.display='none');
document.getElementById('cancelEditBtn').addEventListener('click',()=>editModal.style.display='none');
document.getElementById('closeTranslateBtn').addEventListener('click',()=>transModal.style.display='none');
document.getElementById('saveEditBtn').addEventListener('click',()=>{ if(editingIndex>=0){ notes[editingIndex].title=document.getElementById('editTitle').value; notes[editingIndex].text=document.getElementById('editText').value; const lang=LANGS.find(l=>l.code===document.getElementById('editLang').value); notes[editingIndex].code=lang.code; notes[editingIndex].lang=lang.name; notes[editingIndex].flag=lang.flag; notes[editingIndex].date=new Date().toLocaleString()+' (edited)'; saveAll(); render(); editModal.style.display='none'; }});
document.getElementById('doEditTranslate').addEventListener('click',async()=>{ const to=document.getElementById('editTranslateTo').value; const orig=document.getElementById('editText').value; document.getElementById('editText').value='Translating...'; const tr=await translateText(orig,to); document.getElementById('editText').value=tr; document.getElementById('editLang').value=to; });
document.getElementById('voiceSelect').addEventListener('change',e=>{ settings.voiceURI=e.target.value; saveAll(); });
document.getElementById('speechLang').addEventListener('change',e=>{ settings.speechLang=e.target.value; saveAll(); });
document.getElementById('translateTo').addEventListener('change',e=>{ settings.translateTo=e.target.value; saveAll(); });
document.getElementById('fontSelect').addEventListener('change',e=>{ settings.font=e.target.value; box.style.fontSize=settings.font; saveAll(); });
document.getElementById('speedRange').addEventListener('input',e=>{ settings.speed=e.target.value; document.getElementById('speedVal').textContent=e.target.value; saveAll(); });
document.getElementById('pitchRange').addEventListener('input',e=>{ settings.pitch=e.target.value; document.getElementById('pitchVal').textContent=e.target.value; saveAll(); });
document.getElementById('darkSwitch').addEventListener('click',()=>{ settings.dark=!settings.dark; document.body.classList.toggle('dark',settings.dark); document.getElementById('darkSwitch').classList.toggle('on',settings.dark); saveAll(); });
document.getElementById('autoSwitch').addEventListener('click',()=>{ settings.autoDetect=!settings.autoDetect; document.getElementById('autoSwitch').classList.toggle('on',settings.autoDetect); saveAll(); });
document.getElementById('clearBtn').addEventListener('click',()=>{ if(confirm('Clear all?')){ notes=[]; saveAll(); render(); modal.style.display='none'; }});
document.getElementById('exportPdfBtn').addEventListener('click',()=>{
  if(!notes.length) return alert('No notes');
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.setFontSize(14); doc.text("KrateNote Notes",10,15); let y=25;
  notes.forEach((n,i)=>{ doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(`${i+1}. ${n.title} [${n.lang||''}]`,10,y); y+=6; doc.setFont(undefined,'normal'); const lines=doc.splitTextToSize(n.text,180); if(y+lines.length*6>280){ doc.addPage(); y=15; } doc.text(lines,10,y); y+=lines.length*6+10; });
  doc.save('KrateNote.pdf');
});
document.getElementById('exportTxtBtn').addEventListener('click',()=>{ const txt=notes.map(n=>`${n.title}\n${n.date}\n${n.text}\n`).join('\n---\n\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt])); a.download='KrateNote.txt'; a.click(); });
fillLangSelects(); applySettings(); setEmptyState(); render();
</script>
</body>
</html>
