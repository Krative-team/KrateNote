<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrateNote - iPhone Fixed FULL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{--bg:#F6F7FB;--card:#fff;--text:#111;--muted:#f0f0f0;--box:#f9f9f9;--primary:#111}
  .dark{--bg:#121212;--card:#1e1e1e;--text:#fff;--muted:#2a2a2a;--box:#252525;--primary:#fff}
  *{box-sizing:border-box;font-family:-apple-system,sans-serif} body{margin:0;background:var(--bg);color:var(--text);padding:12px}
  .header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:16px 20px;border-radius:16px;margin-bottom:12px}
  .main{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:12px} @media(min-width:900px){.main{flex-direction:row}}
  .card{background:var(--card);border-radius:16px;padding:16px;flex:1} #transcriptBox{min-height:220px;background:var(--box);border-radius:12px;padding:12px;line-height:26px;font-size:17px;white-space:pre-wrap;border:2px solid transparent} #transcriptBox.listening{border-color:#6366f1;animation:pulse 1s infinite} @keyframes pulse{0%{border-color:#6366f1}50%{border-color:#a5b4fc}100%{border-color:#6366f1}}
  input,select,textarea{width:100%;padding:14px;border-radius:10px;border:none;background:var(--muted);color:var(--text);margin-bottom:10px;font-size:16px}
  button{padding:14px 16px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;justify-content:center;align-items:center}
  .full{width:100%;margin-top:10px} #recBtn{background:var(--primary);color:var(--bg);font-size:16px;padding:18px} #recBtn.rec{background:#e11d48;color:#fff;animation:rec 1s infinite} @keyframes rec{0%{opacity:1}50%{opacity:.7}100%{opacity:1}} #saveBtn{background:#e0e7ff;color:#1e1b4b}
  .note{background:var(--box);padding:12px;border-radius:12px;margin-bottom:12px}
  #settingsModal,#editModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:999;padding:16px}
  .modalBox{background:var(--card);width:100%;max-width:560px;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}
  .row{display:flex;justify-content:space-between;align-items:center;margin:14px 0} .switch{width:50px;height:30px;background:#ccc;border-radius:20px;position:relative;cursor:pointer} .switch.on{background:var(--primary)} .dot{width:26px;height:26px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s} .switch.on .dot{left:22px}
  .iconBtn{width:auto;padding:8px 12px;border-radius:8px;background:var(--muted);color:var(--text);font-size:13px} 
</style>
</head>
<body>
<div class="header"><div><b><i class="fa-solid fa-microphone-lines"></i> KrateNote</b> <span style="font-size:10px;background:#10b981;color:#fff;padding:3px 8px;border-radius:10px">FIXED V3</span><br><small id="modeText">Groq Whisper • iPhone Ready</small> <small id="accText" style="color:#6366f1"></small></div><button class="iconBtn" id="openSetBtn"><i class="fa-solid fa-gear"></i></button></div>

<div class="main">
  <div class="card">
    <input id="titleInput" placeholder="Lecture Title">
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><span style="font-size:11px;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:10px">Server: <span id="serverStatus">Checking...</span></span><span style="font-size:11px;background:#e0e7ff;color:#3730a3;padding:4px 8px;border-radius:10px" id="mimeBadge">Mime: detecting...</span><span id="httpsBadge" style="font-size:11px;padding:4px 8px;border-radius:10px"></span></div>
    <div id="transcriptBox">1. MUST be HTTPS (🔒)<br>2. Tap START → Allow Mic<br>3. Speak LOUD 4 sec<br>4. Tap STOP</div>
    <div id="confBox" style="font-size:11px;opacity:.6;margin-top:6px"></div>
    <div id="translationPreview" style="display:none;margin-top:8px;padding:10px;border-left:4px solid #6366f1;color:#6366f1;background:var(--box);border-radius:8px;font-size:13px"></div>
    <button class="full" id="recBtn"><i class="fa-solid fa-microphone"></i> START RECORDING</button>
    <button class="full" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> SAVE NOTE</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between"><b>Notes (<span id="count">0</span>)</b><button class="iconBtn" id="exportBtn"><i class="fa-solid fa-file-export"></i> Export</button></div>
    <div id="notesList" style="margin-top:12px"></div>
  </div>
</div>

<div id="settingsModal"><div class="modalBox">
  <div style="display:flex;justify-content:space-between"><h3>Settings</h3><button class="iconBtn" id="closeSetBtn"><i class="fa-solid fa-xmark"></i></button></div>
  <label>🔗 Whisper Server URL</label><input id="serverUrl" value="https://kratenote-1.onrender.com">
  <small style="opacity:.6">Must be online: check green badge</small>
  <label style="margin-top:12px">🎙️ Speech Language</label><select id="langSelect"></select>
  <label>🌍 Translate To</label><select id="translateSelect"></select>
  <label>🔊 Voice</label><select id="voiceSelect"><option>Loading...</option></select>
  <label>Font Size</label><select id="fontSelect"><option value="15px">Small</option><option value="17px" selected>Medium</option><option value="20px">Large</option><option value="24px">XL</option></select>
  <div class="row"><span>Dark Mode</span><div id="darkSwitch" class="switch"><div class="dot"></div></div></div>
  <div class="row"><span>Auto-translate</span><div id="autoTransSwitch" class="switch on"><div class="dot"></div></div></div>
  <div class="row"><span>Speak Ibibio/Efik Direct</span><div id="liveIbibioSwitch" class="switch on"><div class="dot"></div></div></div>
  <button class="full iconBtn" id="speakLastBtn"><i class="fa-solid fa-play"></i> Test Voice</button>
  <button class="full iconBtn" id="testServerBtn"><i class="fa-solid fa-plug"></i> Test Whisper Server</button>
  <button class="full" style="background:#fee2e2;color:#b91c1c" id="clearBtn"><i class="fa-solid fa-trash"></i> Clear All Notes</button>
</div></div>

<div id="editModal"><div class="modalBox">
  <div style="display:flex;justify-content:space-between"><h3>Edit</h3><button class="iconBtn" id="closeEditBtn"><i class="fa-solid fa-xmark"></i></button></div>
  <input id="editTitle"><textarea id="editText"></textarea>
  <label>Translate to:</label><select id="editTranslateSelect"></select>
  <div style="display:flex;gap:8px"><button class="full" id="doTranslateBtn" style="background:var(--muted)"><i class="fa-solid fa-language"></i> Translate Now</button><button class="full" id="saveEditBtn" style="background:var(--primary);color:var(--bg)"><i class="fa-solid fa-check"></i> Save</button></div>
</div></div>

<script>
const LANGUAGES=[
  {code:'en-US',name:'English (US)'},{code:'en-GB',name:'English (UK)'},{code:'en-NG',name:'English (Nigeria)'},
  {code:'fr-FR',name:'French'},{code:'es-ES',name:'Spanish'},{code:'ibb-NG',name:'Ibibio (Akwa Ibom) ⭐'},{code:'efi-NG',name:'Efik ⭐'},
];
const TRANS_MAP={'en-US':'en','en-GB':'en','en-NG':'en','fr-FR':'fr','es-ES':'es','ibb-NG':'ibb','efi-NG':'efi'};
const IBIBIO_DICT = {"hello":"Msosobo","good morning":"Mma mmesiere","good morning teacher":"Mma mmesiere ete nwed","today we have class":"mfin emi nnyin inyene esit nwed","thank you":"Sosongo","school":"ufok nwed","teacher":"ete nwed","book":"nwed"};
const EFIK_DICT = {"hello":"Mokomor","good morning":"Emem owuro","thank you":"Sosongho"};

let customDict={}, transCache={};
try{ customDict=JSON.parse(localStorage.getItem('k_customDict')||'{}'); transCache=JSON.parse(localStorage.getItem('k_transCache')||'{}'); }catch(e){}
function customTranslate(text, toCode){
  const cacheKey=toCode+'|'+text.toLowerCase(); if(transCache[cacheKey]) return transCache[cacheKey];
  let dict=toCode==='ibb-NG'?{...IBIBIO_DICT,...customDict}:toCode==='efi-NG'?{...EFIK_DICT,...customDict}:null;
  if(!dict) return null; let lower=text.toLowerCase().trim(); if(dict[lower]){ transCache[cacheKey]=dict[lower]; saveAll(); return dict[lower]; } return null;
}

let isRec=false, mediaRecorder=null, audioChunks=[], transcript='', notes=[], currentMime='detecting', audioStream=null;
let settings={dark:false,autoTrans:true,liveIbibio:true,lang:'en-NG',translateTo:'ibb-NG',font:'17px',voiceURI:'',editingIndex:-1,serverUrl:'https://kratenote-1.onrender.com'};
try{
  notes=JSON.parse(localStorage.getItem('k_notes')||'[]');
  const s=JSON.parse(localStorage.getItem('k_settings')||'{}');
  settings={...settings,...s};
  if(!settings.serverUrl) settings.serverUrl='https://kratenote-1.onrender.com';
}catch(e){}
const recBtn=document.getElementById('recBtn'), box=document.getElementById('transcriptBox'), modal=document.getElementById('settingsModal'), editModal=document.getElementById('editModal'), transPreview=document.getElementById('translationPreview');
let voices=[];
function populateLangs(){const opts=LANGUAGES.map(l=>`<option value="${l.code}">${l.name}</option>`).join(''); document.getElementById('langSelect').innerHTML=opts; document.getElementById('translateSelect').innerHTML='<option value="none">No Translation</option>'+opts; document.getElementById('editTranslateSelect').innerHTML=opts;}
function loadVoices(){voices=speechSynthesis.getVoices(); const sel=document.getElementById('voiceSelect'); if(voices.length) sel.innerHTML=voices.map(v=>`<option value="${v.voiceURI}">${v.name}</option>`).join('');}
speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,500);
function saveAll(){localStorage.setItem('k_notes',JSON.stringify(notes)); localStorage.setItem('k_settings',JSON.stringify(settings));}
function applySettings(){document.body.classList.toggle('dark',settings.dark); document.getElementById('darkSwitch').classList.toggle('on',settings.dark); document.getElementById('autoTransSwitch').classList.toggle('on',settings.autoTrans); document.getElementById('liveIbibioSwitch').classList.toggle('on',settings.liveIbibio); document.getElementById('langSelect').value=settings.lang; document.getElementById('translateSelect').value=settings.translateTo; document.getElementById('fontSelect').value=settings.font; document.getElementById('serverUrl').value=settings.serverUrl; box.style.fontSize=settings.font; checkServer(); checkHTTPS();}
function checkHTTPS(){const b=document.getElementById('httpsBadge'); if(location.protocol==='https:'){ b.textContent='HTTPS ✅'; b.style.background='#dcfce7'; b.style.color='#166534'; } else { b.textContent='NOT HTTPS ❌ MIC WILL FAIL!'; b.style.background='#fee2e2'; b.style.color='#b91c1c'; box.textContent='❌ YOU ARE ON HTTP!\n\niPhone blocks mic on HTTP!\n\nFIX:\n1. Host this file on Netlify/Vercel\n2. Or use https://\n3. Then mic will work'; }}
async function checkServer(){const status=document.getElementById('serverStatus'); try{ const res=await fetch(settings.serverUrl+'/',{method:'GET'}); if(res.ok){ status.textContent='Online ✅'; status.parentElement.style.background='#dcfce7'; } else { status.textContent='Offline ❌'; } }catch(e){ status.textContent='Waking... 30s'; setTimeout(checkServer,5000); }}
async function translateText(text,toLangCode){ if(!text||toLangCode==='none') return text; const custom=customTranslate(text,toLangCode); if(custom) return custom; return text; }
function speak(text){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); if(voices[0]) u.voice=voices[0]; speechSynthesis.speak(u); }

async function initWhisper(){
  try{
    if(location.protocol!=='https:' && location.hostname!=='localhost'){ throw new Error('HTTPS_REQUIRED'); }
    if(!audioStream){
      box.textContent='🎤 Asking for mic permission...\nPlease tap ALLOW';
      audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }
    let mime='audio/mp4';
    if (MediaRecorder.isTypeSupported('audio/mp4')) mime='audio/mp4';
    else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime='audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) mime='audio/webm';
    currentMime=mime;
    document.getElementById('mimeBadge').textContent='Mime: '+mime+' ✅';
    mediaRecorder=new MediaRecorder(audioStream, {mimeType: mime});
    audioChunks=[];
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=async()=>{
      const blob=new Blob(audioChunks, {type: mime});
      const kb=Math.round(blob.size/1024);
      if(blob.size < 1000){
        box.textContent='⚠️ NO AUDIO! '+kb+'KB\n\nOn iPhone:\n1. Check mic permission: Settings > Safari > Mic > Allow\n2. Speak 4 sec LOUD near mic\n3. Must be HTTPS';
        return;
      }
      box.textContent='🧠 Groq transcribing '+kb+'KB...';
      box.classList.add('listening');
      const form=new FormData();
      form.append('file', blob, mime.includes('mp4') ? 'recording.m4a' : 'recording.webm');
      try{
        const res=await fetch(settings.serverUrl+'/transcribe',{method:'POST', body:form});
        const data=await res.json();
        if(data.error) throw new Error(data.error);
        let t=(data.text||'').trim();
        if(!t) throw new Error('No voice detected - speak louder');
        transcript=t;
        box.textContent=t;
        document.getElementById('confBox').textContent='✅ '+kb+'KB → '+t.split(' ').length+' words';
      }catch(e){
        box.textContent='❌ Error: '+e.message+'\nServer: '+settings.serverUrl+'\nBlob: '+kb+'KB';
      }
      box.classList.remove('listening');
    };
    return mediaRecorder;
  }catch(e){
    if(e.message==='HTTPS_REQUIRED'){
      box.textContent='❌ MUST USE HTTPS!\n\nYour site is HTTP, iPhone blocks mic.\n\nUpload this file to Netlify (free) to get HTTPS.';
      alert('HTTP not allowed! Upload to Netlify for HTTPS');
    } else {
      box.textContent='Mic error: '+e.message;
      alert('Mic error: '+e.message);
    }
    return null;
  }
}

recBtn.addEventListener('click', async()=>{
  if(!isRec){
    const rec=await initWhisper(); if(!rec) return;
    audioChunks=[]; transcript='';
    box.textContent='🎙️ LISTENING... Speak LOUD 4 sec!\nExample: "Good morning teacher"';
    try{
      rec.start(100); isRec=true;
      recBtn.innerHTML='<i class="fa-solid fa-stop"></i> STOP RECORDING - TAP AFTER 4 SEC';
      recBtn.classList.add('rec');
    }catch(err){ alert(err.message); }
  } else {
    try{ mediaRecorder.stop(); }catch(e){}
    isRec=false; recBtn.innerHTML='<i class="fa-solid fa-microphone"></i> START RECORDING'; recBtn.classList.remove('rec');
  }
});

async function saveNote(){ if(!transcript.trim()) return alert('Record first!'); const title=document.getElementById('titleInput').value||transcript.split(' ').slice(0,5).join(' '); notes.unshift({title,text:transcript,date:new Date().toLocaleString()}); saveAll(); render(); transcript=''; document.getElementById('titleInput').value=''; box.textContent='✅ Saved!'; }
document.getElementById('saveBtn').addEventListener('click',saveNote);
function render(){ document.getElementById('count').textContent=notes.length; document.getElementById('notesList').innerHTML=notes.map((n,i)=>`<div class="note"><div style="display:flex;justify-content:space-between"><b>${n.title}</b><span style="cursor:pointer" data-del="${i}">🗑️</span></div><small>${n.date}</small><div>${n.text}</div></div>`).join(''); document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{ notes.splice(parseInt(el.dataset.del),1); saveAll(); render(); })); }
document.getElementById('openSetBtn').addEventListener('click',()=>{ modal.style.display='flex'; });
document.getElementById('closeSetBtn').addEventListener('click',()=>modal.style.display='none');
document.getElementById('serverUrl').addEventListener('change',e=>{ settings.serverUrl=e.target.value.trim().replace(/\/$/,''); saveAll(); checkServer(); });
document.getElementById('langSelect').addEventListener('change',e=>{ settings.lang=e.target.value; saveAll(); });
document.getElementById('translateSelect').addEventListener('change',e=>{ settings.translateTo=e.target.value; saveAll(); });
document.getElementById('voiceSelect').addEventListener('change',e=>{ settings.voiceURI=e.target.value; saveAll(); });
document.getElementById('fontSelect').addEventListener('change',e=>{ settings.font=e.target.value; box.style.fontSize=settings.font; saveAll(); });
document.getElementById('darkSwitch').addEventListener('click',()=>{ settings.dark=!settings.dark; document.body.classList.toggle('dark',settings.dark); document.getElementById('darkSwitch').classList.toggle('on',settings.dark); saveAll(); });
document.getElementById('autoTransSwitch').addEventListener('click',()=>{ settings.autoTrans=!settings.autoTrans; document.getElementById('autoTransSwitch').classList.toggle('on',settings.autoTrans); saveAll(); });
document.getElementById('liveIbibioSwitch').addEventListener('click',()=>{ settings.liveIbibio=!settings.liveIbibio; document.getElementById('liveIbibioSwitch').classList.toggle('on',settings.liveIbibio); saveAll(); });
document.getElementById('testServerBtn').addEventListener('click',checkServer);
document.getElementById('exportBtn').addEventListener('click',()=>{ const txt=notes.map(n=>`${n.title}\n${n.text}\n`).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt])); a.download='KrateNote.txt'; a.click(); });
populateLangs(); applySettings(); render();
</script>
</body>
</html>
