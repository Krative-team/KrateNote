<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrateNote - Choose Folder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  *{box-sizing:border-box;font-family:-apple-system,sans-serif} body{margin:0;background:#F6F7FB;color:#111;padding:16px}
  .wrap{max-width:600px;margin:auto}
  .header{text-align:center;padding:20px 0 10px} .header h1{margin:0;font-size:24px} .header p{opacity:.6;font-size:13px;margin:6px 0 0}
  .card{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .folderBtn{background:#f9f9f9;border:2px solid transparent;border-radius:14px;padding:18px 10px;cursor:pointer;text-align:center}
  .folderBtn.active{border-color:#111;background:#eef2ff}
  .folderBtn i{font-size:28px;display:block;margin-bottom:8px;color:#6366f1}
  .folderBtn b{font-size:14px} .folderBtn small{display:block;opacity:.5;font-size:11px;margin-top:3px}
  input{width:100%;padding:12px;border-radius:10px;border:none;background:#eee;margin-bottom:10px;font-size:15px}
  button{padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
  .full{width:100%} .primary{background:#111;color:#fff} .muted{background:#eee}
  .subjItem{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer}
  .subjItem:hover{background:#eef2ff} .subjItem b{font-size:14px} .subjItem small{opacity:.5;font-size:11px}
  .delSubj{background:#fee2e2;color:#991b1b;padding:6px 9px;font-size:11px}
  .back{font-size:13px;color:#6366f1;cursor:pointer;display:none;margin-top:10px}
  /* ===== NEW UI/UX FOR DIALOGUES ===== */
  #newSubject{transition:.2s} #newSubject.error{outline:2px solid #ef4444;background:#fef2f2}
  #newSubject.warn{outline:2px solid #f59e0b;background:#fffbeb}
  #newSubject.shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  #inputError{display:none;font-size:12px;margin:-6px 0 10px;padding:8px 10px;border-radius:8px;font-weight:600;align-items:center;gap:6px}
  #inputError.show{display:flex} #inputError.err{background:#fef2f2;color:#dc2626} #inputError.warn{background:#fffbeb;color:#b45309}
  .subjItem.highlight{outline:2px solid #f59e0b;background:#fffbeb;animation:shake .35s ease}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:999;opacity:0;transition:.3s;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:left}
  #toast.show{transform:translate(-50%,0);opacity:1} #toast.err{background:#dc2626} #toast.warn{background:#d97706}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1><i class="fa-solid fa-microphone-lines"></i> KrateNote</h1>
    <p id="stepText">Step 1 of 2 — Choose a folder</p>
  </div>

  <!-- STEP 1: FOLDERS -->
  <div id="folderStep" class="card">
    <h3 style="margin:0 0 12px">Where is this note for?</h3>
    <div class="grid" id="folderGrid"></div>
  </div>

  <!-- STEP 2: SUBJECTS -->
  <div id="subjectStep" class="card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0" id="subjectTitle">Subjects</h3><span id="folderBadge" style="font-size:12px;background:#eef2ff;color:#3730a3;padding:4px 10px;border-radius:12px"></span></div>
    <p style="font-size:12px;opacity:.6">Pick a subject or add a new one</p>
    <div id="subjectList"></div>
    <div style="display:flex;gap:6px;margin-top:12px"><input id="newSubject" placeholder="Add new subject e.g. Mathematics, Marketing..."><button id="addSubjectBtn" class="primary" style="white-space:nowrap"><i class="fa-solid fa-plus"></i> Add</button></div>
    <div id="inputError"></div>
    <div class="back" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to folders</div>
  </div>
</div>

<div id="toast"></div>

<script>
const user = JSON.parse(localStorage.getItem('k_user')||'null');
if(!localStorage.getItem('k_token') || !user){ location.href='login.html'; }

const FOLDERS=[
  {name:'School', icon:'fa-graduation-cap', desc:'Classes, assignments'},
  {name:'Work', icon:'fa-briefcase', desc:'Meetings, tasks'},
  {name:'Church', icon:'fa-church', desc:'Sermons, devotion'},
  {name:'Personal', icon:'fa-user', desc:'Journal, diary'},
  {name:'Business', icon:'fa-chart-line', desc:'Ideas, plans'},
  {name:'General', icon:'fa-folder', desc:'Anything else'},
];
let subjects = JSON.parse(localStorage.getItem('k_subjects')||'{}');
let selectedFolder = localStorage.getItem('k_current_folder') || '';
let toastTimer=null;

function saveSubjects(){ localStorage.setItem('k_subjects', JSON.stringify(subjects)); }

// ===== NEW: Toast + Inline Error =====
function showToast(msg, type){
  const t=document.getElementById('toast');
  t.className='show '+(type||'');
  t.innerHTML = type==='err' ? '<i class="fa-solid fa-circle-exclamation"></i> '+msg : type==='warn' ? '<i class="fa-solid fa-triangle-exclamation"></i> '+msg : '<i class="fa-solid fa-circle-check"></i> '+msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=''; }, 2600);
}
function showInputError(msg, type){
  const el=document.getElementById('inputError');
  const input=document.getElementById('newSubject');
  el.className='show '+(type==='err'?'err':'warn');
  el.innerHTML = (type==='err' ? '<i class="fa-solid fa-circle-exclamation"></i> ' : '<i class="fa-solid fa-triangle-exclamation"></i> ') + msg;
  input.classList.remove('error','warn','shake');
  void input.offsetWidth;
  input.classList.add(type==='err'?'error':'warn','shake');
  input.focus();
}
function clearInputError(){
  const el=document.getElementById('inputError');
  const input=document.getElementById('newSubject');
  el.className=''; el.innerHTML='';
  input.classList.remove('error','warn','shake');
}

function renderFolders(){
  document.getElementById('folderGrid').innerHTML = FOLDERS.map(f=>`
    <div class="folderBtn" data-folder="${f.name}">
      <i class="fa-solid ${f.icon}"></i><b>${f.name}</b><small>${f.desc}</small>
    </div>`).join('');
  document.querySelectorAll('.folderBtn').forEach(b=>b.addEventListener('click',()=>{
    selectedFolder=b.dataset.folder;
    document.getElementById('folderStep').style.display='none';
    document.getElementById('subjectStep').style.display='block';
    document.getElementById('stepText').textContent='Step 2 of 2 — Choose a subject';
    document.getElementById('backBtn').style.display='block';
    document.getElementById('subjectTitle').textContent = selectedFolder + ' Subjects';
    document.getElementById('folderBadge').textContent = selectedFolder;
    clearInputError();
    renderSubjects();
  }));
}
function renderSubjects(){
  const list = subjects[selectedFolder] || [];
  const box=document.getElementById('subjectList');
  if(list.length===0){
    box.innerHTML='<div style="text-align:center;padding:16px;opacity:.5;font-size:13px"><i class="fa-solid fa-book-open" style="font-size:24px;display:block;margin-bottom:6px"></i>No subjects yet.<br>Add your first subject below.</div>';
  } else {
    box.innerHTML=list.map((s,i)=>`<div class="subjItem" data-subj="${s.replace(/"/g,'&quot;')}"><div><b><i class="fa-solid fa-book"></i> ${s}</b><br><small>Tap to open notes</small></div><button class="delSubj" data-del="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('');
    box.querySelectorAll('.subjItem').forEach(el=>el.addEventListener('click',(e)=>{
      if(e.target.closest('.delSubj')) return;
      localStorage.setItem('k_current_folder', selectedFolder);
      localStorage.setItem('k_current_subject', el.dataset.subj);
      location.href='index.html';
    }));
    box.querySelectorAll('.delSubj').forEach(btn=>btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.del);
      if(confirm('Delete subject "'+list[idx]+'"? Notes in it will still be saved but hidden until you re-add it.')){
        subjects[selectedFolder].splice(idx,1); saveSubjects(); renderSubjects();
      }
    }));
  }
}
document.getElementById('addSubjectBtn').addEventListener('click',()=>{
  const input=document.getElementById('newSubject');
  const v=input.value.trim();
  if(!v){
    showInputError('Please type a subject name first', 'err');
    showToast('Please type a subject name first', 'err');
    return;
  }
  if(!subjects[selectedFolder]) subjects[selectedFolder]=[];
  // Case-insensitive check
  const existing = subjects[selectedFolder].find(s=> s.toLowerCase()===v.toLowerCase());
  if(existing){
    showInputError(`"${existing}" already exists in ${selectedFolder}`, 'warn');
    showToast(`"${existing}" already exists — tap it to open`, 'warn');
    // Highlight the existing subject
    const items=document.querySelectorAll('.subjItem');
    items.forEach(el=>{
      if(el.dataset.subj.toLowerCase()===v.toLowerCase()){
        el.classList.add('highlight');
        el.scrollIntoView({behavior:'smooth', block:'center'});
        setTimeout(()=>el.classList.remove('highlight'), 1800);
      }
    });
    input.select();
    return;
  }
  subjects[selectedFolder].push(v); saveSubjects(); input.value=''; clearInputError(); renderSubjects();
  showToast(`"${v}" added to ${selectedFolder} ✓`, '');
});
document.getElementById('newSubject').addEventListener('input',()=>{ clearInputError(); });
document.getElementById('newSubject').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('addSubjectBtn').click(); });
document.getElementById('backBtn').addEventListener('click',()=>{
  document.getElementById('subjectStep').style.display='none';
  document.getElementById('folderStep').style.display='block';
  document.getElementById('stepText').textContent='Step 1 of 2 — Choose a folder';
  document.getElementById('backBtn').style.display='none';
});
renderFolders();
</script>
</body>
</html>
