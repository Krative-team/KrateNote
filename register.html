<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - KrateNote</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KrateNote">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script>
  // THEME SYNC: Follow Settings from index.html - no flash
  (function(){
    try{
      var t = localStorage.getItem('k_theme');
      if(!t){
        var s = JSON.parse(localStorage.getItem('k_settings')||'{}');
        t = s.dark ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>
  :root{--bg:#F6F7FB;--card:#fff;--text:#111;--muted:#eee;--primary:#111}
  html[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--text:#fff;--muted:#2a2a2a;--primary:#fff}
  *{box-sizing:border-box;font-family:-apple-system,sans-serif} body{margin:0;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
  .box{background:var(--card);color:var(--text);width:100%;max-width:400px;border-radius:20px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  .logo{text-align:center;margin-bottom:20px} .logo i{font-size:42px;background:#111;color:#fff;width:64px;height:64px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center}
  h2{margin:8px 0 4px;text-align:center} .sub{text-align:center;opacity:.6;font-size:14px;margin-bottom:20px}
  input{width:100%;padding:14px;border-radius:12px;border:none;background:var(--muted);color:var(--text);margin-bottom:12px;font-size:15px}
  input::placeholder{color:#888}
  button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--primary);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
  .link{text-align:center;margin-top:16px;font-size:14px} .link a{color:#6366f1;text-decoration:none;font-weight:600}
  .error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none} .error.on{display:block} .ok{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none} .ok.on{display:block}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><i class="fa-solid fa-microphone-lines"></i></div>
  <h2>Create account</h2>
  <p class="sub">Join KrateNote - 30 languages</p>
  <div id="err" class="error"></div><div id="ok" class="ok"></div>
  <input id="name" placeholder="Full name">
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password (min 6 chars)">
  <button id="regBtn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
  <div class="link">Already have account? <a href="login.html">Login</a></div>
</div>
<script>
const SERVER='https://kratenote-1.onrender.com';
document.getElementById('regBtn').addEventListener('click',async()=>{
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err'), ok=document.getElementById('ok');
  if(!name||!email||!password){err.textContent='Fill all fields';err.classList.add('on');return;}
  if(password.length<6){err.textContent='Password too short';err.classList.add('on');return;}
  document.getElementById('regBtn').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
  try{
    const res=await fetch(SERVER+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
    const data=await res.json();
    if(data.error){err.textContent=data.error;err.classList.add('on'); ok.classList.remove('on');}
    else{ok.textContent='Account created! Redirecting to login...';ok.classList.add('on');err.classList.remove('on');setTimeout(()=>location.href='login.html',1500);}
  }catch(e){err.textContent='Server error';err.classList.add('on');}
  document.getElementById('regBtn').innerHTML='<i class="fa-solid fa-user-plus"></i> Create Account';
});
</script>
</body>
</html>
